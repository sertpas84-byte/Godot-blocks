      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install scons zstandard
      - name: Build template_release arm64
        working-directory: godot
        run: scons platform=android target=template_release arch=arm64 $FLAGS
      - name: Build template_debug arm64
        working-directory: godot
        run: scons platform=android target=template_debug arch=arm64 $FLAGS
      - name: Generate Android templates (APK)
        working-directory: godot/platform/android/java
        run: ./gradlew generateGodotTemplates
      - uses: actions/upload-artifact@v4
        with:
          name: godot-blocks-android-templates
          path: |
            godot/bin/android_debug.apk
            godot/bin/android_release.apk
            godot/bin/android_source.zip
